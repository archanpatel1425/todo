mutation UpdateTask(
  $task_id: String!
  $title: String!
  $task_description: String!
  $dueDate: String!
  $priority: String!
  $status: String!
) {
  updateTask(
    task_id: $task_id
    title: $title
    task_description: $task_description
    dueDate: $dueDate
    priority: $priority
    status: $status
  ) {
    task_id
    title
    task_description
    dueDate
    status
    priority
    createdAt
    updatedAt
  }
}
