mutation CreateTodo(
  $title: String!
  $task_description: String!
  $dueDate: String!
  $userId: String!
  $priority: String!
) {
  createTodo(
    title: $title
    task_description: $task_description
    dueDate: $dueDate
    userId: $userId
    priority: $priority
  ) {
    task_id
    title
    task_description
    dueDate
    status
    priority
  }
}
